spring.application.name=catalog-management

# PostgreSQL connection — update these to match your local setup
spring.datasource.url=jdbc:postgresql://localhost:5432/catalog_management
spring.datasource.username=jasleen.kaur
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate DDL — 'update' auto-creates/alters tables to match entities
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
